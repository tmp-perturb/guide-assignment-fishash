name: assignment_fishash
channels:
  - conda-forge
  - bioconda
dependencies:
  # fishash 0.99.0 requires R >=4.5; its exact runtime source is vendored in
  # the method module, while this file declares only direct runtime packages.
  - r-base=4.5.3
  - r-optparse=1.7.5
  - r-jsonlite=2.0.0
  - r-dplyr=1.1.4
  - r-matrix=1.7_6
  - bioconductor-s4vectors=0.50.3
  - bioconductor-summarizedexperiment
  - bioconductor-sparsematrixstats=1.22.0
